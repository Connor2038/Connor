# Character Folder bootstrap template.
# Schema: character-folder/v0.1 (aligned to Streaming Avatar 1.0.2).
#
# 1.0.2 alignment notes:
#   - First-frame person references are authored through appearance.yaml.
#   - TTS lives in voice.yaml, which translates to pipeline_config.tts_config
#     (the 1.0.2 standard). The legacy avatars[].voice path is not used.
schema_version: character-folder/v0.1
name: Connor
has_app: false
# Default model for new Projects; Preview may override it with the selected model.
model: vivix-a1-stream:1.0.7
session_defaults:
  aspect_ratio: "9:16"
  resolution: "720p"
  recording_mode: "on"
# Optional runtime pipeline fields can be added without changing the Folder schema.
# Example: pipeline_config: {tag_audio_enabled: true}
# Existing fields generated by voice.yaml, tts_config, vlm_config, and prompts/*
# retain their values. New nested fields may be added; duplicate leaf keys fail.
# Do not combine this map with provider/vivix_official_dh30.yaml.
